<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRAvel Web Slicer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="panel">
        <h1>TRAvel web</h1>
        <p class="hint">Post-processes PrusaSlicer G-code into branch-by-branch spiral (vase) toolpaths. Slice with 1 perimeter, 0% infill, 0 top layers, spiral vase <b>off</b>, arc fitting off.</p>
        <label class="drop" id="drop">
          <input type="file" id="file" accept=".gcode,.gco,.g" />
          <span id="dropText">Drop a .gcode file here or click to choose</span>
        </label>
        <fieldset>
          <legend>Hot end clearance</legend>
          <label>Nozzle radius (mm) <input type="number" id="nozzleRadius" value="2.5" step="0.1" min="0" /></label>
          <label>Nozzle height (mm) <input type="number" id="nozzleHeight" value="4" step="0.5" min="0" /></label>
          <label>Shroud radius (mm) <input type="number" id="shroudRadius" value="30" step="1" min="0" /></label>
          <label>Gantry height (mm, blank = none) <input type="number" id="gantryHeight" value="" step="1" min="0" /></label>
        </fieldset>
        <fieldset>
          <legend>Printing</legend>
          <label>Bottom layers to keep as sliced <input type="number" id="bottomLayers" value="3" step="1" min="0" /></label>
          <label>Travel lift (mm) <input type="number" id="travelLift" value="1" step="0.1" min="0" /></label>
          <label>Print speed (mm/s, blank = from file) <input type="number" id="printSpeed" value="" step="1" min="1" /></label>
          <label>Fan (%, blank = from file) <input type="number" id="fan" value="" step="5" min="0" max="100" /></label>
        </fieldset>
        <div class="row">
          <button id="process" disabled>Process</button>
          <button id="download" disabled>Download G-code</button>
        </div>
        <div id="messages"></div>
        <div id="stats"></div>
        <fieldset id="viewCtl" hidden>
          <legend>Preview</legend>
          <label>Show up to segment <span id="segLabel">all</span>
            <input type="range" id="segRange" min="0" max="0" value="0" /></label>
          <label><input type="checkbox" id="showTravel" checked /> show travels</label>
          <label><input type="checkbox" id="showBottom" checked /> show passthrough layers</label>
        </fieldset>
      </aside>
      <main id="view"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
